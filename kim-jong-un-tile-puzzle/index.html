<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Kim Jong Un Tile Puzzle</title>
    <style>
      html, body { padding: 0; margin: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
      #unity-container { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/KimJongUnTilePuzzle/Build";
      var config = {
        dataUrl: buildUrl + "/KimJongUnTilePuzzle.data",
        frameworkUrl: buildUrl + "/KimJongUnTilePuzzle.framework.js",
        codeUrl: buildUrl + "/KimJongUnTilePuzzle.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Kim Jong Un Tile Puzzle",
        productVersion: "1.0"
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/KimJongUnTilePuzzle.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config).then((unityInstance) => {}).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
