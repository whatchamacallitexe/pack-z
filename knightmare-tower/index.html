<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Knightmare Tower</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%}#container{width:100vw;height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="container"></div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.addEventListener("DOMContentLoaded", () => {
  let ruffle = window.RufflePlayer.newest();
  let player = ruffle.createPlayer();
  let container = document.getElementById("container");
  player.style.width = "100%";
  player.style.height = "100%";
  container.appendChild(player);
  player.load("https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/KnightmareTower/KnightmareTower.swf");
});
</script>
</body>
</html>
